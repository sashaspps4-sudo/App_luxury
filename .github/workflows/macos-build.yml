name: macOS desktop build

on:
  workflow_dispatch:
    inputs:
      include_intel:
        description: Also build for Intel Macs
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        exclude: ${{ fromJSON(inputs.include_intel && '[]' || '[{"arch":"x64"}]') }}
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build self-contained app and DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        run: npm run macos:build -- --target ${{ matrix.target }}
      - name: Test encryption and native session state
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --lib
      - name: Verify bundle resources and native signatures
        run: node scripts/verify-macos-bundle.mjs "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Luxury Mailer.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Luxury-Mailer-macOS-${{ matrix.arch }}-unsigned
          path: desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
