[package]
name = "luxury-mailer"
version = "0.1.0"
description = "Secure desktop workspace for email campaigns"
authors = ["Luxury Mailer"]
edition = "2021"

[lib]
name = "luxury_mailer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }


# Pure Rust authenticated encryption is also tested on Windows.
[dependencies.aes-gcm]
version = "=0.10.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
