
<table width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width:550px;background-color:#ffffff;border-radius:4px;border-collapse:collapse;overflow:hidden;text-align:left">
    <tbody>
        <tr>
            <td style="background-color:#ffffff;padding:20px 25px;border-bottom:1px solid #e2e8f0">
                <img src="https://www.vectorlogo.es/wp-content/uploads/2019/10/logo-vector-wallapop.jpg" alt="Wallapop" style="width:150px;max-width:150px;height:auto;display:block;border:0">
            </td>
        </tr>
        <tr>
            <td style="padding:30px 25px;background-color:#ffffff">
                <div style="font-size:24px;font-weight:800;color:#14c2ae;margin-bottom:10px;font-family:'Segoe UI',Arial,sans-serif">
                    Tu producto ha encontrado un comprador
                </div>
                <div style="font-size:18px;font-weight:600;color:#2d3748;margin-bottom:20px;font-family:'Segoe UI',Arial,sans-serif">
                    Gestión de envío en Wallapop
                </div>

                <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border-left:4px solid #14c2ae;background-color:#f9f9f9;margin-bottom:25px;border-collapse:collapse">
                    <tbody>
                        <tr>
                            <td style="padding:15px;font-family:'Segoe UI',Arial,sans-serif">
                                <div style="margin-bottom:8px;font-size:14px;color:#333333">
                                    <span style="color:#777777">Producto:</span>
                                    <span style="font-weight:700;color:#212121">{item}</span>
                                </div>
                                <div style="margin-bottom:8px;font-size:14px;color:#333333">
                                    <span style="color:#777777">Detalles:</span>
                                    <span style="font-weight:700;color:#212121">{price} €</span>
                                </div>
                                <div style="font-size:14px;color:#333333">
                                    <span style="color:#777777">Fecha:</span>
                                    <span style="font-weight:700;color:#212121">{data}</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div style="margin:30px 0">
                    <a href="{link}" style="display:inline-block;background-color:#14c2ae;color:#ffffff!important;padding:12px 30px;text-decoration:none;border-radius:20px;font-weight:600;font-size:14px;font-family:'Segoe UI',Arial,sans-serif;text-align:center" target="_blank" rel="noopener noreferrer">
                        Gestionar envío
                    </a>
                </div>

                <p style="font-size:13px;color:#666666;line-height:1.5;margin:0;font-family:'Segoe UI',Arial,sans-serif">
                    Consulta los detalles del envío directamente en Wallapop y verifica el estado de la operación antes de continuar.
                </p>
            </td>
        </tr>
        <tr>
            <td style="padding:20px 25px;background-color:#fcfcfc;border-top:1px solid #eeeeee;text-align:right;font-family:'Segoe UI',Arial,sans-serif">
                <span style="font-size:11px;color:#777777;vertical-align:middle">Descargar:</span>
                <a href="https://play.google.com/store/search?q=Wallapop&c=apps" style="text-decoration:none;display:inline-block;vertical-align:middle;margin-left:10px" target="_blank" rel="noopener noreferrer">
                    <img src="https://s.2dehands.be/email/res/images/playstore@2x.png" style="height:28px;width:auto;border:0;display:block" alt="Google Play">
                </a>
                <a href="https://apps.apple.com/" style="text-decoration:none;display:inline-block;vertical-align:middle;margin-left:10px" target="_blank" rel="noopener noreferrer">
                    <img src="https://s.2dehands.be/email/res/images/appstore@2x.png" style="height:28px;width:auto;border:0;display:block" alt="App Store">
                </a>
            </td>
        </tr>
    </tbody>
</table>
