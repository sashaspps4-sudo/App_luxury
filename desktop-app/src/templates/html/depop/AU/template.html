
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depop - Verification Required</title>
</head>
<body style="margin:0;padding:20px 10px;background-color:#f4f4f6;font-family:Arial,Helvetica,sans-serif;">

<table role="presentation" align="center" width="600" cellpadding="0" cellspacing="0" border="0"
       style="width:100%;max-width:600px;margin:0 auto;background:#ffffff;border-collapse:collapse;">

  <tr>
    <td style="padding:20px 25px;background:#ffffff;border-bottom:1px solid #e1e1e5;">
      <a href="https://www.depop.com/" style="text-decoration:none;">
        <img src="https://mms.businesswire.com/media/20250605058107/en/2489420/5/2024_LOGO_RED.jpg"
             alt="Depop" width="100"
             style="display:block;width:100px;height:auto;border:0;">
      </a>
    </td>
  </tr>

  <tr>
    <td style="padding:35px 30px 15px;">
      <h1 style="margin:0;font-size:22px;color:#000000;font-weight:800;line-height:1.3;">
        Verification Required
      </h1>
      <p style="margin:15px 0 0;font-size:15px;color:#222222;line-height:1.6;">
        Please confirm your payment information to keep your account active.
      </p>
    </td>
  </tr>

  <tr>
    <td style="padding:5px 30px 25px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

        <tr>
          <td style="padding:12px 0;border-bottom:1px solid #eeeeee;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" style="font-size:13px;color:#555555;">ID</td>
                <td align="right" style="font-size:13px;color:#000000;font-weight:700;">95926672</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:12px 0;border-bottom:1px solid #eeeeee;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="left" style="font-size:13px;color:#555555;">Date</td>
                <td align="right" style="font-size:13px;color:#000000;font-weight:700;">{data}</td>
              </tr>
            </table>
          </td>
        </tr>

      </table>
    </td>
  </tr>

  <tr>
    <td align="center" style="padding:10px 30px 40px;">
      <a href="{link}"
         style="display:inline-block;background:#ff0000;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:15px 40px;text-align:center;border-radius:4px;">
        Verify Now
      </a>
    </td>
  </tr>

  <tr>
    <td style="padding:24px 25px;background:#ffffff;border-top:1px solid #e1e1e5;text-align:center;">

      <p style="margin:0 0 12px;font-size:12px;line-height:1.7;color:#222222;">
        Depop Limited.<br>
        100 New Bridge Street, London, EC4V 6JA, UK.
      </p>

      <p style="margin:0;font-size:11px;line-height:1.5;color:#555555;">
        Automatic notification.
      </p>

    </td>
  </tr>

</table>

</body>
</html>
