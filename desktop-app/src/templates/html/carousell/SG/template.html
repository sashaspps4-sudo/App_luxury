
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carousell - Item Sold!</title>
</head>
<body style="margin:0;padding:32px 12px;background-color:#f3f4f6;font-family:Arial,sans-serif;">

<table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0"
       width="560"
       style="width:100%;max-width:560px;background-color:#ffffff;border-radius:8px;overflow:hidden;">

  <tr>
    <td style="background-color:#d8232a;padding:16px 24px;">
      <span style="color:#ffffff;font-weight:900;font-size:22px;letter-spacing:-0.5px;">
        carousell
      </span>
    </td>
  </tr>

  <tr>
    <td style="background-color:#111827;padding:10px 24px;color:#ffffff;font-size:12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="left" style="color:#9ca3af;">
            Order ID: <strong style="color:#ffffff;">#24626676</strong>
          </td>
          <td align="right" style="color:#9ca3af;">
            {data}
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:32px 32px 24px;">
      <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#111827;line-height:1.3;">
        Item Sold!
      </h1>

      <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#374151;">
        Great news! Your item has been successfully paid for on Carousell Singapore.
      </p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="background-color:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:24px;">
        <tr>
          <td style="padding:20px;">
            <h2 style="margin:0 0 8px;font-size:16px;font-weight:700;color:#111827;line-height:1.4;">
              {item}
            </h2>
            <div style="font-size:20px;font-weight:800;color:#d8232a;">
              {price}
            </div>
          </td>
        </tr>
      </table>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td align="center" style="padding:8px 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="border-radius:6px;background-color:#d8232a;">
                  <a href="{link}"
                     style="font-size:15px;font-family:Arial,sans-serif;color:#ffffff;text-decoration:none;border-radius:6px;padding:14px 28px;border:1px solid #d8232a;display:block;font-weight:700;text-align:center;">
                    Confirm Order →
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="background-color:#f9fafb;padding:24px 32px;border-top:1px solid #f3f4f6;text-align:center;">
      <p style="margin:0 0 12px;font-size:12px;color:#6b7280;">
        <a href="#" style="color:#4b5563;text-decoration:underline;margin:0 8px;">Carousell SG</a> |
        <a href="#" style="color:#4b5563;text-decoration:underline;margin:0 8px;">Help Centre</a> |
        <a href="#" style="color:#4b5563;text-decoration:underline;margin:0 8px;">Privacy Policy</a>
      </p>

      <p style="margin:0;font-size:11px;color:#9ca3af;line-height:1.4;">
        © Carousell Sdn. Bhd.<br>
        This is an automated notification, please do not reply.
      </p>
    </td>
  </tr>

</table>

</body>
</html>
